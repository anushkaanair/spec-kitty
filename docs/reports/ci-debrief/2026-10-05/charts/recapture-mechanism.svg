<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Swansea, Georgia, serif" font-size="11" fill="#231D12">
  <title>How the shard-timing recapture loop works</title>
  <desc>A daily scheduled workflow runs two independent jobs. The recapture job detects drift with a count-only pass, captures only the drifted modules within a 70-minute budget without credentials, and publishes a pull request on a fixed branch using a dedicated token. That pull request runs normal per-PR CI and is merged by a maintainer; per-PR shard selection then reads the refreshed timings file. The strict check job independently goes red while drift exists.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5342"/>
    </marker>
    <style>
      .box{fill:#FFFFFF;stroke:#DED6C2;stroke-width:1.2}
      .key{fill:#FFFFFF;stroke:#C99A0E;stroke-width:1.6}
      .tok{fill:#FDF3CF;stroke:#C99A0E;stroke-width:1.2}
      .alarm{fill:#FBE9E9;stroke:#d03b3b;stroke-width:1.2}
      .h{font-family:'Falling Sky',sans-serif;font-weight:700;font-size:12px}
      .m{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#5A5342}
      .s{font-size:10px;fill:#5A5342}
      .ln{stroke:#5A5342;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .lane{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;fill:#8A8578}
    </style>
  </defs>

  <!-- trigger -->
  <rect class="key" x="10" y="150" width="104" height="70" rx="6"/>
  <text class="h" x="22" y="172">Schedule</text>
  <text class="m" x="22" y="188">cron 41 4 * * *</text>
  <text class="s" x="22" y="204">daily, 04:41 UTC</text>

  <!-- lane labels -->
  <text class="lane" x="140" y="22">JOB 1 · RECAPTURE-SHARD-TIMINGS (main only)</text>
  <text class="lane" x="140" y="300">JOB 2 · STRICT-SHARD-TIMINGS-CHECK (independent, no token)</text>

  <!-- detect -->
  <rect class="tok" x="140" y="34" width="132" height="92" rx="6"/>
  <text class="h" x="150" y="54">1 Detect</text>
  <text class="s" x="150" y="71">Is a recapture PR</text>
  <text class="s" x="150" y="84">already open?</text>
  <text class="m" x="150" y="102">token: PAT</text>
  <text class="m" x="150" y="115">gh pr list only</text>

  <!-- capture -->
  <rect class="box" x="290" y="34" width="190" height="150" rx="6"/>
  <text class="h" x="300" y="54">2 Capture (no credentials)</text>
  <text class="s" x="300" y="72">a. Count tests per module</text>
  <text class="m" x="312" y="85">pytest --collect-only</text>
  <text class="s" x="300" y="102">b. Drifted = count differs, or</text>
  <text class="s" x="312" y="115">provenance missing/invalid</text>
  <text class="s" x="300" y="132">c. Re-time drifted modules,</text>
  <text class="s" x="312" y="145">oldest capture first</text>
  <text class="s" x="300" y="162">d. Stop starting at 70 min;</text>
  <text class="s" x="312" y="175">the rest are "deferred"</text>

  <!-- publish -->
  <rect class="tok" x="498" y="34" width="150" height="92" rx="6"/>
  <text class="h" x="508" y="54">3 Publish</text>
  <text class="s" x="508" y="71">Push fixed branch</text>
  <text class="m" x="508" y="85">ci/recapture-</text>
  <text class="m" x="508" y="96">shard-timings</text>
  <text class="s" x="508" y="113">open PR or add commit</text>

  <!-- PR -->
  <rect class="key" x="498" y="150" width="212" height="76" rx="6"/>
  <text class="h" x="508" y="170">Recapture pull request</text>
  <text class="s" x="508" y="187">runs normal per-PR CI because a</text>
  <text class="s" x="508" y="200">PAT, not GITHUB_TOKEN, pushed it</text>
  <text class="s" x="508" y="215">maintainer reviews and merges</text>

  <!-- timings file -->
  <rect class="box" x="290" y="210" width="190" height="64" rx="6"/>
  <text class="h" x="300" y="229">Committed timings file</text>
  <text class="m" x="300" y="244">.github/ci-shard-timings.json</text>
  <text class="s" x="300" y="261">per-test durations + provenance</text>

  <!-- shard select -->
  <rect class="box" x="134" y="210" width="142" height="64" rx="6"/>
  <text class="h" x="144" y="230">Every PR</text>
  <text class="s" x="144" y="247">shard_select splits each</text>
  <text class="s" x="144" y="261">module into even shards</text>

  <!-- strict -->
  <rect class="alarm" x="140" y="310" width="340" height="70" rx="6"/>
  <text class="h" x="150" y="330">Strict check: exact test-count agreement</text>
  <text class="m" x="150" y="347">SPEC_KITTY_STRICT_SHARD_TIMINGS=1</text>
  <text class="s" x="150" y="364">Red while any module has drifted (the alarm). On PRs the</text>
  <text class="s" x="150" y="377">same mismatch is only a ShardTimingsDriftWarning.</text>

  <!-- arrows -->
  <path class="ln" d="M114,175 C126,175 126,80 138,80"/>
  <path class="ln" d="M114,195 C126,195 126,345 138,345"/>
  <path class="ln" d="M272,80 L288,80"/>
  <path class="ln" d="M480,80 L496,80"/>
  <path class="ln" d="M564,126 L564,148"/>
  <path class="ln" d="M520,226 C520,242 500,242 482,242"/>
  <path class="ln" d="M290,242 L278,242"/>
  <path class="ln" d="M385,186 L385,208"/>
  <text class="m" x="390" y="200">writes</text>
  <text class="m" x="486" y="256">merge</text>
  <rect class="tok" x="520" y="330" width="14" height="10" rx="2"/>
  <text class="s" x="540" y="339">step holds the dedicated PAT</text>
  <rect class="key" x="520" y="350" width="14" height="10" rx="2"/>
  <text class="s" x="540" y="359">entry and hand-off points</text>
</svg>
