complete: true
phase: spec
lens_group: arch
mission: ci-nightly-interpreter-matrix-45min-timeout-01M3G17F
findings:
  - id: SPEC-ARCH-001
    lens: Escalation suite-key dedup correctness claim vs. actual script behavior
    severity: 4
    title: >-
      Per-shard --suite-key uniqueness (User Story 3 / NFR-003) relies on a
      script whose find-then-create dedup is not atomic, but the spec only
      requires manual inspection, never a machine-checked uniqueness gate
    evidence:
      - artifact: "spec.md § NFR-003 (Escalation dedup correctness across shards)"
      - artifact: "spec.md § Clarifications, Correction #5"
      - artifact: "spec.md § FR-011, § Edge Cases (no entry addresses suite-key collision)"
      - code: "scripts/ci/nightly_escalation.py:118-131 (run_escalation: find_open_issue_by_marker then create_issue, no lock/CAS between the two calls)"
      - code: "scripts/ci/nightly_escalation.py:188-198 (GitHubIssueClient.find_open_issue_by_marker: GitHub Search API, eventually consistent, matched by substring marker in body)"
      - code: ".github/workflows/ci-nightly.yml:445-450 (current single-job escalate step: --suite-key \"interpreter-${{ matrix.python-version }}\")"
    claim: >-
      Verified against the actual script: (a) --suite-key is confirmed
      genuinely free-form/unconstrained (argparse string, no registry or
      allowlist coupling) -- the spec's Correction #5 claim is TRUE on this
      point. (b) The dedup mechanism (a marker string
      "<!-- nightly-escalation-key: {key} -->" embedded in the issue body,
      located via a GitHub Search API query plus an exact-substring filter)
      correctly keeps two DIFFERENT suite-keys from ever colliding onto the
      same issue, and correctly re-opens a fresh issue (by design, not a
      defect) once a prior one for the same key was closed on recovery. So
      the spec's core dedup-mechanism claim also holds. (c) However, neither
      spec.md nor research.md calls out that run_escalation's policy is a
      classic check-then-act race: find_open_issue_by_marker() and
      create_issue() are two separate, unlocked API calls, and the search
      index itself is eventually consistent. If two invocations ever run
      concurrently for the SAME --suite-key -- e.g. a future maintainer
      copy-pastes the escalation step across shards without varying the key
      (an easy mistake precisely because the existing single-job step already
      hardcodes a key-shaped string, "interpreter-${{ matrix.python-version
      }}", that a naive per-shard copy would leave unchanged) -- both
      processes can find "no existing open issue" and both create one,
      silently opening duplicate P0 issues for a run where `fail-fast: false`
      guarantees the shards execute concurrently. The spec's own answer to
      this exact hazard (NFR-003) is "verifiable by inspecting each shard's
      escalation step for a --suite-key value unique across the shard set"
      -- i.e. manual code review, not an automated, falsifiable check. This
      is inconsistent with the mission's own stated rigor bar: User Story 2
      explicitly frames this repo's dominant failure mode as "a code path
      that reports success while silently doing less than it claims" and
      requires FR-004's coverage-completeness to be machine-checked rather
      than "a manual review of directory lists" (NFR-002) -- yet the
      escalation-uniqueness guarantee, which guards against the same class of
      silent-duplication hazard, is left exactly at the level of rigor (human
      inspection) the spec elsewhere rejects as insufficient. No FR/AC in the
      spec requires an automated test asserting that every shard's
      --suite-key literal in the committed ci-nightly.yml is pairwise
      distinct (and distinct from the existing "performance"/"e2e"/"stress"
      keys), so a copy-paste key collision across shards could ship silently
      and only surface in production as duplicated P0 issues on a future red
      night.
    remediation: >-
      Add a machine-checked, falsifiable assertion for suite-key uniqueness,
      most naturally as an extension of the same guard file FR-009/FR-010
      are already updating (tests/architectural/test_performance_marker_guard.py):
      parse ci-nightly.yml's job definitions, extract every literal
      `--suite-key "<value>"` argument passed to nightly_escalation.py across
      all interpreter shards (string-render `${{ matrix.* }}`/similar
      expressions where static, or require the value to be a static string
      per shard), and assert the resulting set has no duplicates and no
      collision with the pre-existing "performance"/"e2e"/"stress" keys --
      paired with a mutation test (a deliberately duplicated key in a scratch
      copy) proving the new assertion can fail, per this mission's own
      Standing Order #5 non-vacuity bar. Fold this into FR-011/NFR-003 as an
      explicit deliverable (a new FR or an NFR-003 amendment) rather than
      leaving NFR-003 satisfied by inspection alone.
