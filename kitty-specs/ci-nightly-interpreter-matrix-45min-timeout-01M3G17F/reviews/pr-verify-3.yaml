  - id: PR-FRESH2-001
    status: resolved
    reason: >-
      At c14967a6f, `_marker_exprs_are_boolean_equivalent` builds the truth table over
      `sorted(_marker_names_referenced(expr_a) | _marker_names_referenced(expr_b))` (the
      UNION of names from both sides) and evaluates both expressions via pytest's own
      `_pytest.mark.expression.Expression.compile(...).evaluate(...)` for every
      True/False assignment; `_marker_expr_diverges_from_expected_shard_marker` is the
      SOLE call site feeding `_shard_workflow_divergences`'s `bad_markers` set -- no
      `positive_marker_tokens`-based comparison remains in this path (that function is
      still used elsewhere in `_gate_coverage.py` for the unrelated "architectural marker
      routing" concern, not for shard-divergence). Drove the production function directly
      (no tracked file edited; `git status --porcelain` empty throughout) with cases
      beyond the shipped table: `diverges("unit or fast or fast")` = False (equivalent,
      correct), `diverges("(fast and unit) or fast or unit")` = False (equivalent,
      correct), `diverges("fast or not unit")` = True (correct), `diverges("unit")` =
      True (correct), and `diverges("fastish or unit")` = True -- this last case proves
      the union-of-names claim empirically, since "fastish" appears only in the
      workflow-side expression and must be varied for the check to catch it. The exact
      PR-FRESH2-001 regression, `"fast and unit"`, is now flagged
      (`diverges("fast and unit")` = True), reversing the false negative the finding
      reported at aad3e78f8. Malformed-expression behavior fails loudly rather than
      silently passing: an unclosed-paren expression raises `SyntaxError` and a
      kwarg-style selector raises `TypeError`, both surfaced during
      `_marker_names_referenced`'s `ast.parse`/matcher-call step before any comparison
      result could be returned -- neither is a silent pass, so no severity-4 regression
      was introduced (the error messages are plain Python tracebacks rather than a
      purpose-authored message, a minor UX gap outside this finding's scope, not a
      correctness or silent-failure defect). The shipped permanent test
      `test_shard_workflow_divergence_check_boolean_equivalence_truth_table` proves both
      directions (reorders/reformats/double-negation pass; combinator swap/dropped
      name/added exclusion/widened alternative/full negation fail) against the
      PRODUCTION `_shard_workflow_divergences`, not inline logic. Full regression:
      `tests/architectural/test_interpreter_shard_coverage.py`,
      `tests/architectural/test_performance_marker_guard.py`, `tests/ci/`, and
      `tests/upgrade/test_migration_robustness.py` together ran 613 passed, 0 failed,
      0 errors in 168.08s.
