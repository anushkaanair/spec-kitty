      pre-existing path-mutation test (`test_shard_workflow_divergence_check_fails_when_a_real_path_is_altered`,
      now calling `_scratch_gates_with(...)` directly) and every marker-mutation test
      (`_scratch_gates_with_marker`, now a one-line wrapper over
      `_scratch_gates_with(real_gates, victim, lambda _g: {"marker_expr": marker_expr})`,
      consumed by 5 call sites including the new truth-table test) route through this
      single helper -- no manual five-field `Gate(...)` reconstruction remains anywhere
      in the file. The mutation tests exercise the production
      `_shard_workflow_divergences` path (verified above for PR-FRESH2-001), so the
      dataclasses.replace refactor is exercised by real assertions, not decorative.
  - id: PR-FRESH2-003
    status: resolved
