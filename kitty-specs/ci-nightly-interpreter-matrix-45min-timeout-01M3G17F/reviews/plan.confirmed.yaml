findings:
  - id: PLAN-GOV-001
    lens: Dispatch-run sequencing fidelity to operator Q2 (mission-derived lens)
    severity: 2
    title: >-
      Stop-rule text is written around "run 2 fails" / "run 3 exhausted" and
      does not explicitly say how a failed run 1 (baseline/timing-capture)
      is accounted against the up-to-3 budget
    evidence:
      - artifact: "plan.md § B, point 4 (line 272), the 'Explicit stop rule' sentence"
      - artifact: "plan.md § B, point 1 (line 269), run 1's own description"
      - artifact: "spec.md § Clarifications, Q2 (lines 322-327)"
    claim: >-
      plan.md §B names three specific-purpose runs and its only explicit
      stop rule is anchored to "if run 2 fails ..." / "if run 3 is also
      exhausted" / "if a 4th run would be needed for any reason." It never
      addresses the case where run 1 itself fails to produce usable data
      before ever reaching its measurement purpose. The catch-all clause
      still caps the total at 3, but the plan gives no explicit rule for
      which run's "slot" a run-1 redo consumes.
    remediation: >-
      Add one sentence to §B (after point 4, or as a 4a) stating explicitly
      that a failed run 1 still counts against the up-to-3 total, its
      replacement consumes the next run's slot (renumbering rather than
      adding a 4th attempt), and the same escalate-to-operator stop rule
      applies if that replacement also fails.

  - id: PLAN-GOV-002
    lens: Directive — Standing Order #7 (git/workflow discipline, DIRECTIVE_045)
    severity: 2
    title: >-
      Charter Check claims a blanket "PASS" for Standing Order #7 without
      engaging its worktree-isolation clause
    evidence:
      - artifact: "plan.md § Charter Check (line 52)"
      - artifact: ".kittify/charter/charter.md § Quality & Tech-Debt Standing Orders, item 7 (lines 85-87)"
    claim: >-
      Standing Order #7 includes "isolate PR-touching agents in a worktree"
      (DIRECTIVE_045). plan.md's Charter Check addresses only "PRs only,"
      "never push main," and "dispatches run on the mission's own named
      branch," then marks the whole standing order PASS. Neither plan.md nor
      spec.md contains the word "worktree" anywhere.
    remediation: >-
      Add a sentence to the Charter Check's SO#7 line citing that
      implement-phase execution runs through spec-kitty's own resolved
      worktree (CLAUDE.md's Execution Workspace Strategy /
      resolve_workspace_for_wp), or, if this mission's shape would not
      automatically go through that resolver, add an explicit line to §I
      stating which isolated worktree the build/implement-phase agent
      operates from before pushing/dispatching.

