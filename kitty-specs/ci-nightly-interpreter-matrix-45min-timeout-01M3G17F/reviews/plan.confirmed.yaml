  - id: PLAN-VERIFY-001
    lens: "Escalation suite-key distinctness and mutation-testability (FR-011/FR-015/NFR-003)"
    severity: 3
    title: "Suite-key-uniqueness scan method is under-specified and cites a precedent that does not do what plan.md says it does"
    evidence:
      - artifact: "plan.md §A 'Suite-key-uniqueness assertion' (lines 261-263)"
      - code: "tests/architectural/test_performance_marker_guard.py:349-363 (_spec_kitty_run_performance_leaks)"
      - code: "tests/architectural/test_performance_marker_guard.py:516-529 (test_nightly_fail_loud_step_treats_marker_empty_exit_5_as_non_failing)"
      - code: "tests/architectural/test_performance_marker_guard.py:25-32 (no `re` import)"
    claim: >-
      Plan.md cites `_spec_kitty_run_performance_leaks` as precedent for
      "scan run: script text" — that function inspects a structured `env:`
      dict, not run text. The file's real precedent uses `run.splitlines()`,
      a per-line scan. Plan.md leaves the extraction method undecided
      without pinning quote-style handling or line-vs-blob scoping — a
      per-line scan could miss a `--suite-key` split across a continued
      line, letting a real future collision slip past the guard silently.
    remediation: >-
      In plan.md §A, commit to one concrete extraction method: parse the
      already-loaded YAML jobs: mapping and iterate each job's steps[].run
      string, matching both single- and double-quoted --suite-key values
      applied to the FULL run: string (not line-by-line). Correct the
      citation to name the real per-line-scan precedent. Add a mutation
      test variant colliding two suite-keys with different quote styles.

  - id: PLAN-VERIFY-002
    lens: "Gates — §E gate-set verification against live workflow files"
    severity: 2
    title: "plan.md's packs.yml claim ('should NOT fire') describes the wrong mechanism — the workflow always triggers; only its lane jobs skip"
    evidence:
      - artifact: "plan.md §E 'NOT ENFORCED' list, packs.yml line"
      - code: ".github/workflows/packs.yml:12-19 (deliberately no top-level on.*.paths, #3008)"
      - code: ".github/workflows/packs.yml:39-44 (top-level on: has no paths: filter)"
      - code: ".github/workflows/packs.yml:245-258 (packs-gate terminal job: if: always() && !cancelled())"
    claim: >-
      packs.yml deliberately carries no top-level path filter (#3008
      Gate-0 avoidance) — it fires on every PR unconditionally; only its
      per-lane verification jobs skip via if: false for a non-packs/-
      touching diff. Plan.md's phrasing describes the opposite mechanism.
      Net practical conclusion still correct; cited mechanism backwards.
    remediation: >-
      In plan.md §E, state that packs.yml triggers on every PR (deliberately
      no top-level path filter, #3008) but its changes job's filter does not
      match .github/workflows/** or tests/architectural/**, so every
      built-in/internal lane job reports if: false and the terminal
      packs-gate resolves green with no packs-specific work performed.
