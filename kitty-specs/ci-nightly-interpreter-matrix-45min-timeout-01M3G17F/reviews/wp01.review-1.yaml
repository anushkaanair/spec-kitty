findings:
  - id: WP01-R1-001
    severity: 3
    lens: mutation-non-vacuity
    file: "tests/architectural/test_interpreter_shard_coverage.py:170-201"
    claim: >
      SC-003 and WP01/T004 explicitly and non-optionally require a
      "deliberately-mutated fixture ... proving the check can fail" for the
      FR-004 coverage-completeness guard (Standing Order #5, "a gate-unmask
      cannot self-validate"). The two delivered tests,
      test_coverage_completeness_check_fails_on_a_dropped_test_file and
      test_coverage_completeness_check_fails_on_a_duplicated_test_file, do
      not exercise the shipped guard at all: they build fabricated dummy
      node-id sets (e.g. "tests/unit/test_a.py::test_one") and re-run
      hand-inlined set-arithmetic that never calls collect_job_nodeids,
      _shard_gate, INTERPRETER_SHARDS, or the real
      test_shard_union_equals_full_selection_with_zero_gap_and_zero_overlap
      function. If that production test's logic were broken (inverted
      comparison, dropped assert, wrong operator), these "positive
      controls" would still pass, because they touch none of the code they
      claim to validate. This is exactly the "restates the guard instead of
      exercising it" anti-pattern this review's lens 3 and directive
      #041/tactic delete-the-assertion-not-the-test name.
    evidence: >
      Read tests/architectural/test_interpreter_shard_coverage.py:170-201
      (quoted in review transcript). Contrast with the guard-file mutation
      tests in the same diff (test_guard_fails_when_a_shard_is_dropped_from_the_job_list,
      test_suite_key_uniqueness_guard_is_non_vacuous, etc.), which DO factor
      out and call the real production predicate (_shard_job_presence_ok,
      _all_suite_keys) against mutated data -- proving the pattern was known
      and applied correctly elsewhere in this same diff, just not here.
      Independent revert-discipline check (see gates below): I mutated the
      REAL tests/architectural/_interpreter_shard_roster.py (dropped
      "tests/cli" from shard-1's paths, in-memory edit, reverted after),
      re-ran test_shard_union_equals_full_selection_with_zero_gap_and_zero_overlap,
      and it genuinely failed naming "513 node id(s) collected by the full
      selection but by NO shard" -- so the underlying production guard is
      NOT actually vacuous today; only WP01's own required non-vacuity
      *proof artifact* is fake. Tree confirmed clean after revert (`git
      status --porcelain` empty, byte-diff against pre-edit copy empty).
    remedy: >
      Replace the two toy tests with real mutation tests against production
      inputs: e.g. monkeypatch/parametrize INTERPRETER_SHARDS (or extract the
      union/overlap arithmetic from
      test_shard_union_equals_full_selection_with_zero_gap_and_zero_overlap
      into a small pure helper both the real test and the mutation tests
      call) so the "dropped test file" / "duplicated test file" scenarios
      are proven against the actual shard Gate/collect_job_nodeids pipeline,
      not a hand-rolled set-arithmetic replica with fabricated ids.
