    remedy: "Backfill Activity Log entries summarizing each subtask's completion before this WP is considered done, for future auditability."
  - id: WP01-R1-003
    severity: 1
    lens: escalation
    file: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/tracer-design-decisions.md:144-157"
    claim: >
      FR-011/FR-015's per-shard suite keys correctly stayed distinct (verified
      live: run 1 auto-opened #5169 for shard-3 alone; run 2 auto-opened #5172
      for shard-4 alone -- confirmed via `gh issue view`). This escalation
      behavior on non-main dispatch runs is PRE-EXISTING (scripts/ci/nightly_escalation.py
      has zero diff in this WP -- confirmed by `git diff ee7494599..51f0d6dc3 --stat -- scripts/`
      returning nothing), not something this WP changed -- stated factually,
      no action needed on that point. Separately: the newly-discovered
      Python-3.13-only pre-existing test failures in shards 3/4 (documented in
      this tracer file) are recorded as "the discovery, not yet the
      disposition" -- the charter's Pre-existing Failure Reporting Rule
      (a filed issue with failure summary and why-judged-pre-existing) does
      not appear to have been completed as of this diff; only the two
      auto-opened nightly-red escalation issues (#5169, #5172, which merely
      link a run URL) exist so far.
    evidence: "gh issue view 5169/5172 --repo spec-kitty/spec-kitty; tracer-design-decisions.md and tracer-approach.md's own text ('for the orchestrator to post to #3189 ... rather than being posted by this WP session itself')."
    remedy: >
      Not a WP01 defect -- the WP session was explicitly instructed not to
      comment on GitHub issues, and correctly deferred the actual filing to
      the orchestrator/PR-prep stage. Flagging so the orchestrator confirms
      this is closed out (a Pre-existing Failure issue filed, or an existing
      one found and linked) before the PR is marked ready-for-squad, per
      SC-007/NFR-005.
