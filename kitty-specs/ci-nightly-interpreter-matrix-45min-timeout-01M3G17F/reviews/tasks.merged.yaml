findings:
  - id: TASKS-DECOMP-001
    lens: "Bounded-diff / one-PR-reviewable-in-one-sitting"
    severity: 4
    title: "WP01's owned_files grants a directory-wide scripts/ci/*.py glob that contradicts the mission's own 'no code change to nightly_escalation.py' claim and the 'bounded diff' claim"
    evidence:
      - code: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/tasks/WP01-interpreter-matrix-shard-split.md:52-57 (owned_files: .github/workflows/ci-nightly.yml, tests/architectural/test_performance_marker_guard.py, tests/architectural/test_interpreter_shard_coverage.py, tests/architectural/_interpreter_shard_roster.py, scripts/ci/*.py)"
      - artifact: "tasks.md §'WP granularity: ONE work package (WP01)', lines 58-60: \"The mission's own diff is bounded (one workflow file, one extended test file, two new small files) and remains reviewable in one sitting\" — this enumerates exactly 4 files, none under scripts/ci/."
      - artifact: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/plan.md:32 — \"Primary Dependencies\": \"scripts/ci/nightly_escalation.py (unmodified, --suite-key already free-form ...)\""
      - artifact: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/spec.md:410 — \"scripts/ci/nightly_escalation.py requires no code change for this [mission]\""
      - code: "No T00X subtask in WP01-interpreter-matrix-shard-split.md names any scripts/ci/ file in its 'Files:' line."
    claim: >
      WP01's frontmatter `owned_files` includes the glob `scripts/ci/*.py`,
      granting this WP write ownership of every Python script under
      `scripts/ci/` — a directory containing multiple files owned by other,
      unrelated missions in this same repo's history. This is inconsistent
      both with this mission's own explicit statements ("nightly_escalation.py
      ... unmodified" / "requires no code change") and with tasks.md's own
      "bounded diff" claim. No subtask ever touches any file under scripts/ci/,
      so the grant is both unused and undocumented, and risks spurious
      `finalize-tasks --validate-only` ownership-overlap collisions against any
      concurrent mission that legitimately edits one specific scripts/ci/*.py
      file.
    remediation: >
      Remove `scripts/ci/*.py` from WP01's `owned_files` entirely. If a future
      subtask is genuinely expected to touch a specific script, name that one
      file explicitly, never a directory-wide glob.

  - id: TASKS-DECOMP-002
    lens: "Single-concern / no vacuous or ambiguous subtask boundaries"
    severity: 3
    title: "Parseability-checkpoint count is self-inconsistent across T002/T007/T009/T010's own cross-references"
    evidence:
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md:268-269 — T002 Notes: \"checkpoint 0 of 3 (the other two checkpoints are T007 and T009/T010 below)\""
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md:496-499 — T007 Purpose cites itself as \"checkpoint 1 of 3\"."
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md:522-524 — T007 Notes: \"the FIRST of two mandatory post-authoring parseability checkpoints (the second, unconditional one is T010; a conditional one may also occur in T009 below)\" — contradicts T002's grouping of T009+T010 as a single second item."
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md:586-588 — T009 step 4 self-labels as \"checkpoint 2 of 3\"."
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md:608-613 — T010 step 3 self-labels as \"checkpoint 3 of 3\"."
    claim: >
      Four different subtask sections each describe the required
      `_gate_coverage.parse_workflow` re-verification checkpoints, but their
      own cross-references disagree on how many checkpoints exist and how
      they are numbered (3 total per T002 vs. 4 distinct per T009/T010's own
      labels, with T007 explicitly excluding T009 from its "two mandatory"
      count). An implementer relying on any single subtask's framing could
      plausibly miscount which checkpoints are required.
    remediation: >
      Settle on one consistent count and numbering scheme across all four
      notes: 4 distinct checkpoints total — checkpoint 0 (T002), checkpoint 1
      (T007, mandatory), checkpoint 2 (T009, conditional — only fires if T009
      redraws boundaries), checkpoint 3 (T010, mandatory/unconditional).
      Rewrite T002's and T007's Notes to match this scheme consistently.

  - id: TASKS-DECOMP-003
    lens: "Reviewable-in-one-sitting / phasing-step-to-subtask traceability"
    severity: 2
    title: "tasks.md's '1:1 traceable' claim overstates the mapping: plan.md §I step 2 alone expands into four subtasks (T004-T007), not one"
    evidence:
      - artifact: "tasks.md, WP-granularity note, lines 50-56: \"the subtasks are deliberately kept 1:1 traceable to plan.md §I's own numbered phasing sequence...\""
      - artifact: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/plan.md:365 — §I step 2 is a single numbered phasing item covering roster authoring, the coverage-completeness check, AND the guard update together, plus an embedded parseability-checkpoint clause."
      - artifact: "tasks.md:115-118 — T004 (\"part A\"), T005 (\"part B\"), T006 (\"part C\") all trace to the single step 2; T007 (\"checkpoint 1 of 3\") also traces to step 2's embedded checkpoint clause — four subtasks tracing to one phasing item."
    claim: >
      Every subtask does trace back to an identifiable plan.md concern and no
      phasing step is silently dropped — the underlying decomposition is
      sound — but the tasks.md claim that subtasks are kept "1:1 traceable" to
      the numbered phasing sequence is not literally accurate: it is a
      one-to-many mapping for step 2. This is disclosed transparently within
      the subtask labels themselves, so it does not mislead an implementer,
      but the "1:1" framing in tasks.md's own justification is imprecise.
    remediation: >
      Reword tasks.md's WP-granularity note to say each subtask "traces back
      to exactly one specific plan.md §I concern" rather than "1:1 traceable
      to plan.md §I's own numbered phasing sequence", and explicitly note that
      step 2 was deliberately split into four subtasks (T004-T007) for
      reviewability.

  - id: TASKS-SEQ-001
    lens: phasing
    severity: 1
    title: "T001/T002 are documented as strictly serial but are independent read-only checks"
    evidence:
      - artifact: "tasks.md § Parallel Opportunities: \"No subtask in this WP is parallel-safe with another.\""
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md T001 \"Parallel?: No — must precede every other subtask.\" and T002 \"Parallel?: No — precedes the shard-split design work (T004-T006)\""
    claim: >
      T001 (baseline pytest run) and T002 (static parseability re-derivation
      against the CURRENT ci-nightly.yml) are both read-only measurements
      against the same not-yet-touched checkout, with no data dependency
      between them. The blanket claim "No subtask in this WP is parallel-safe
      with another" is therefore not quite accurate, though this has no
      practical effect since WP01 runs under a single implementer agent.
    remediation: >
      Either note T001/T002 as "independently orderable, both must precede
      T003" rather than folding them into the blanket "no subtask is
      parallel-safe" statement, or leave as-is with a one-line acknowledgment
      that the single-agent execution model makes the distinction moot.

