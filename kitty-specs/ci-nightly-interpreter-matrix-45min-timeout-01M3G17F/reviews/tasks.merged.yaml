  - id: TASKS-SEQ-004
    lens: "mission-derived — dispatch-run mapping fidelity"
    severity: 3
    title: "The binding pre-push leak check (T008/T011/T013) is diff-history-based and is already non-zero for reasons unrelated to any live leak"
    evidence:
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md T008 step 1: \"BINDING PRE-PUSH CHECK (non-negotiable): run `git log -p main..HEAD | grep -cE '/home/|/tmp/'` and confirm it prints `0`. If it prints anything other than 0, STOP.\" (repeated verbatim in T011 step 1 and T013 step 1)"
      - code: "Re-run against this checkout: `git log -p main..HEAD | grep -cE '/home/|/tmp/'` → 10 (verified twice)"
      - code: "`grep -n '<user>\\|/home/|/tmp/' kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/tracer-tooling-friction.md` → no hits (current tree state is clean)"
      - code: "`git log --oneline a63e103f7..HEAD` shows `13dc5d966` redacted lines originally added by `afcf3bcd6`/`c9ab2c1bd` via a new commit rather than an amend"
    claim: >
      The current tree is clean, but `git log -p` shows the full history of
      every commit's diff, so the leaked string appears once as an added line
      (earlier commit) and once as a removed line (the fix commit) — both
      counted by the grep. T008/T011/T013's binding, non-negotiable check is
      already tripped, before WP01's own first commit, for a reason unrelated
      to any live leak — an artifact of how `git log -p` re-shows already-fixed
      history, not a defect in the current workspace. An implementer following
      this literally would stop and investigate a leak that no longer exists,
      at worst tempting a forbidden history rewrite to force the count to zero.
    remediation: >
      Change the binding pre-push check from a full diff-history scan to a
      working-tree / current-diff scan immune to already-fixed history, e.g.
      `git grep -nE '/home/|/tmp/' -- $(git diff --name-only main...HEAD)` or
      `git diff main...HEAD | grep -E '^\+.*(/home/|/tmp/)'`. Apply to all
      three occurrences (T008, T011, T013).

