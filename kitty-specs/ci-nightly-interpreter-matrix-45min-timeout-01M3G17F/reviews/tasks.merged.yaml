      - artifact: "lanes.json `write_scope`: includes `tests/architectural/test_performance_marker_guard.py` alongside `.github/workflows/ci-nightly.yml`"
      - artifact: "plan.md § Guard-update plan (FR-009/FR-010): `test_performance_marker_guard.py` guards `performance`, `e2e`, `stress`, and every interpreter shard job."
