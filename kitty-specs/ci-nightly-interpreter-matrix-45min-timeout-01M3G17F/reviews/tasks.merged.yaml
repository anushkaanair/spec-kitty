  - id: TASKS-VERIFY-001
    lens: "absolute-path leak hygiene (independent git-history verification)"
    severity: 4
    title: >-
      The mission's own tasks-phase git history still contains a leaked
      absolute local path right now; tasks.md/WP01 wording asserts it "was
      fixed" when only the file CONTENT was redacted, not the history
    evidence:
      - code: "Live command: `git log -p main..HEAD | grep -cE '/home/|/tmp/'` -> `10`."
      - code: "`git show afcf3bcd6 | grep -nE '/home/|/tmp/'` -> 3 hits, all in tracer-tooling-friction.md, e.g. `+   ~/.kittify/cache/agent-commands-freshness.lock; ...\"`. This commit INTRODUCES the leak."
      - code: "`git show 13dc5d966 | grep -nE '/home/|/tmp/'` -> the SAME 3 lines, now as `-` (removed), replaced with `~/...` — an additive fix commit, not a history rewrite, so afcf3bcd6's own diff/blob permanently retains the raw paths."
      - code: "`grep -rE '/home/|/tmp/' kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/` against the CURRENT tree -> only 4 hits, all the literal grep PATTERN quoted as documentation in WP01 — not real leaks. Current file content is genuinely clean; only git history is dirty."
      - code: "`git ls-remote --heads origin` shows no matching ref — this branch has NOT yet reached origin; the remediation window is still open."
      - artifact: "tasks.md lines 158-161 and WP01 T008 step 1 both assert the earlier leak 'was fixed' in a way that reads as fully resolved — it is only resolved at the file-content level."
    claim: >
      This is a present-tense, already-committed defect in this mission's own
      git history on a PUBLIC repo, not a future risk. Commit afcf3bcd6 leaked
      `~/...` paths; commit 13dc5d966 cleaned the file content
      but left the leak permanently visible in history. The branch as
      currently committed already violates this mission's own binding rule.
    remediation: >
      This tasks-phase session is explicitly forbidden from rebase/amend/reset
      and so cannot self-remediate. Required: an operator-authorized history
      rewrite of the local mission branch BEFORE it is ever pushed to origin
      (confirmed still feasible — the branch has not yet been pushed). If no
      such rewrite is authorized, the branch must not be pushed with this
      history intact. Separately, correct the "and was fixed" wording in
      tasks.md and WP01 T008 to state precisely that only file content was
      redacted, not git history.

  - id: TASKS-VERIFY-002
    lens: "absolute-path leak hygiene (forward-looking gate robustness)"
    severity: 4
    title: >-
      T008's binding pre-push leak check will trip non-zero on its very
      first run for a reason the WP text has no instruction for, risking a
      stuck implementer or an improvised forbidden git operation
    evidence:
      - artifact: "tasks/WP01-interpreter-matrix-shard-split.md T008 step 1: \"...If it prints anything other than 0, STOP. Do not push. Find and fix the leaking content ... Only proceed once the count is 0.\" (repeated in T011/T013; Review Guidance re-asserts the count 'still prints 0')"
      - code: "As established in TASKS-VERIFY-001, the count is already `10` before WP01 implementation starts. T008 is the FIRST subtask that pushes anything, so its check is guaranteed to fail on the very first invocation, for a leak predating WP01 that no current-content edit can zero out."
    claim: >
      T008/T011/T013's instruction presumes every nonzero reading is a fresh,
      fixable-by-editing-a-file leak — false for this exact branch. As written,
      an implementer either (a) loops forever trying to "find and fix" content
      that is already clean, (b) never realizes the gate can never pass
      without a history rewrite and silently stalls, or (c) self-authorizes a
      forbidden rebase/reset to force the count to 0.
    remediation: >
      Add an explicit fallback clause to T008 (mirrored in T011/T013): "If the
      count is nonzero and no uncommitted or newly-pushed change of yours
      introduced it, check whether the match traces to an earlier,
      already-committed commit (`git show <sha> | grep -nE '/home/|/tmp/'` for
      each commit in `main..HEAD`). If so, STOP and escalate to the operator
      for a history-rewrite decision; do not attempt rebase/amend/reset
      yourself under any circumstance."
