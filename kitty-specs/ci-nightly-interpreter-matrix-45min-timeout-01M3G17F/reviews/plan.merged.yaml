findings:
  - id: PLAN-GOV-001
    lens: Dispatch-run sequencing fidelity to operator Q2 (mission-derived lens)
    severity: 2
    title: >-
      Stop-rule text is written around "run 2 fails" / "run 3 exhausted" and
      does not explicitly say how a failed run 1 (baseline/timing-capture)
      is accounted against the up-to-3 budget
    evidence:
      - artifact: "plan.md § B, point 4 (line 272), the 'Explicit stop rule' sentence"
      - artifact: "plan.md § B, point 1 (line 269), run 1's own description"
      - artifact: "spec.md § Clarifications, Q2 (lines 322-327)"
    claim: >-
      plan.md §B names three specific-purpose runs (1: baseline/timing-capture,
      2: validation, 3: spare) and its only explicit stop rule (line 272) is
      anchored to "if run 2 fails ..." / "if run 3 is also exhausted" / "if a
      4th run would be needed for any reason." It never addresses the case
      where run 1 itself fails to produce usable data before ever reaching
      its measurement purpose. The catch-all clause does still cap the total
      at 3 regardless of which named run absorbs a retry, so this is not a
      Q2-limit violation, but the plan gives the build/implement phase no
      explicit rule for which run's "slot" a run-1 redo consumes.
    remediation: >-
      Add one sentence to §B (after point 4, or as a 4a) stating explicitly
      that a failed run 1 still counts against the up-to-3 total, its
      replacement consumes the next run's slot (the sequence renumbers rather
      than adding a 4th attempt), and the same escalate-to-operator stop rule
      applies if that replacement also fails.

  - id: PLAN-GOV-002
    lens: Directive — Standing Order #7 (git/workflow discipline, DIRECTIVE_045)
    severity: 2
    title: >-
      Charter Check claims a blanket "PASS" for Standing Order #7 without
      engaging its worktree-isolation clause
    evidence:
      - artifact: "plan.md § Charter Check (line 52)"
      - artifact: ".kittify/charter/charter.md § Quality & Tech-Debt Standing Orders, item 7 (lines 85-87)"
    claim: >-
      Standing Order #7 reads in full: "PRs only, the programme merge agent
      merges; read intent before any high-risk op; isolate PR-touching agents
      in a worktree; no version numbers in scope" (DIRECTIVE_045,
      pr-agent-worktree-isolation). plan.md's Charter Check addresses "PRs
      only," "never push main," and "dispatches run on the mission's own
      named branch," then marks the whole standing order PASS — but never
      mentions the worktree-isolation clause; neither plan.md nor spec.md
      contains the word "worktree" anywhere.
    remediation: >-
      Either add a sentence to the Charter Check's SO#7 line citing that
      implement-phase execution runs through spec-kitty's own resolved
      worktree (per CLAUDE.md's Execution Workspace Strategy /
      resolve_workspace_for_wp), or, if this mission's single-PR/no-WP-split
      shape would NOT automatically go through that resolver, add an explicit
      line to §I stating which isolated worktree the build/implement-phase
      agent operates from before pushing/dispatching.

  - id: PLAN-GOV-003
    lens: Campsite scope / dispatch-run sequencing (mission-derived lens)
    severity: 3
    title: >-
      No explicit instruction to remove IC-03's temporary per-shard
      `--collect-only` measurement scaffolding before the shape that ships
      in the merged workflow
    evidence:
      - artifact: "plan.md § B, point 1 (line 269): 'an ADDITIONAL lightweight step per shard (or one extra always-run job) that runs pytest --collect-only ...'"
      - artifact: "plan.md § I, step 4 (line 356): 'Finalize N and each shard's timeout-minutes from run 1's real numbers; update the workflow and roster accordingly'"
      - artifact: "plan.md § A, 'nightly-summary update (FR-006)' (line 250): SC-006 requires zero dangling reference to the old job name"
    claim: >-
      §B point 1 describes adding, for run 1 only, a temporary per-shard
      `--collect-only` measurement step. §I step 4 never explicitly says
      this scaffolding is removed (or its absence verified) before run 2 is
      dispatched or before the PR is opened. SC-006's dangling-old-job-name
      check does not cover leftover throwaway measurement steps — a distinct
      hazard of permanently shipping one-off diagnostic steps in every future
      nightly run.
    remediation: >-
      Add an explicit instruction to §I step 4 (or a new step 4a): remove
      IC-03's temporary per-shard `--collect-only` measurement step(s) from
      the workflow before run 2 is dispatched, and confirm their absence with
      a final grep/diff before the PR is opened.

  - id: PLAN-ARCH-001
    lens: FR-017/SC-010 reuse-vs-rejection decision soundness
    severity: 4
    title: >-
      "Parseability confirmed" is factually false: _gate_coverage.py's
      parse_workflow already fails to parse the CURRENT interpreter-matrix
      job into any Gate, and will fail identically for every proposed shard
      job, breaking gates_for_target's FR-016 detection as designed.
    evidence:
      - artifact: "plan.md §A 'Reuse-vs-rejection decision' point 6 ('Parseability confirmed'), and §A 'Per-shard job shape' code block"
      - code: ".github/workflows/ci-nightly.yml:416 (current interpreter-matrix pytest step: `uv run --frozen --python \"${{ matrix.python-version }}\" --all-extras pytest -m \"fast or unit\" ...`)"
      - code: "tests/architectural/_gate_coverage.py:230-268 (_FLAG_TOKENS / _PREFIX_RE), :354-376 (strip_to_command), :398-414 (parse_pytest_invocation), :814-848 (parse_workflow)"
    claim: >-
      Plan.md §A claims the current single interpreter-matrix job already
      parses into one Gate and that each shard's identical-shaped invocation
      will too. Empirically false: `parse_workflow` against the live
      `ci-nightly.yml` returns exactly 5 gates (performance, e2e, stress,
      full-module-matrix, integration-next) — ZERO for interpreter-matrix.
      Root cause: the `_FLAG_TOKENS` regex's bare `--frozen` optional-value
      alternative greedily swallows the next flag's name (`--python`),
      leaving `--python`'s quoted value unconsumed, breaking the prefix-strip
      loop before it reaches `pytest`. This is unique to the two-flag
      `--frozen --python "<value>" --all-extras` shape; the five other
      ci-nightly.yml jobs use the simpler `--frozen pytest ...` form and
      parse fine. Plan.md's proposed per-shard template reproduces this exact
      broken prefix verbatim, so `gates_for_target` will unconditionally
      raise "resolved to 0 gates" for EVERY shard, always — not only when a
      shard is actually dropped or renamed — breaking FR-016's deleted-shard
      detection and FR-004's roster-vs-live-selector comparison as designed.
    remediation: >-
      Before authoring test_interpreter_shard_coverage.py, actually run
      `_gate_coverage.parse_workflow`/`gates_for_target` against a draft copy
      of the proposed shard job YAML and confirm a non-empty Gate list.
      Either (1) fix `_gate_coverage.py`'s `_FLAG_TOKENS` regex so a bare
      `--flag` immediately followed by another `--flag "<value>"` does not
      consume the second flag's name as the first flag's value, or (2) drop
      the redundant `--python "<value>"` flag from the per-shard `uv run`
      line (Python is already pinned via actions/setup-python +
      UV_PROJECT_ENVIRONMENT), matching the already-parsing job shape. Add a
      regression test to _gate_coverage.py's own suite pinning that the
      chosen shape parses into a Gate, and re-verify gates_for_target
      empirically before relying on it for FR-016.

