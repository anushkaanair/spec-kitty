  - id: PLAN-VERIFY-001
    lens: "Escalation suite-key distinctness and mutation-testability (FR-011/FR-015/NFR-003)"
    severity: 3
    title: "Suite-key-uniqueness scan method is under-specified and cites a precedent that does not do what plan.md says it does"
    evidence:
      - artifact: "plan.md §A 'Suite-key-uniqueness assertion' (lines 261-263)"
      - code: "tests/architectural/test_performance_marker_guard.py:349-363 (_spec_kitty_run_performance_leaks)"
      - code: "tests/architectural/test_performance_marker_guard.py:516-529 (test_nightly_fail_loud_step_treats_marker_empty_exit_5_as_non_failing, the file's actual run-text-scanning precedent)"
      - code: "tests/architectural/test_performance_marker_guard.py:25-32 (module imports — no `re` import exists anywhere in this file today)"
    claim: >-
      Plan.md cites `_spec_kitty_run_performance_leaks` as precedent for
      "scan run: script text" — that function actually inspects a structured
      `env:` dict, not run text at all. The file's real precedent
      (`test_nightly_fail_loud_step_treats_marker_empty_exit_5_as_non_failing`)
      uses `run.splitlines()`, a per-line scan. Plan.md leaves the extraction
      method undecided between "a regex ... or an AST-free string scan"
      without pinning quote-style handling or line-vs-blob scoping. If
      implemented as a per-line scan mirroring the file's real precedent, a
      `--suite-key` flag/value split across a continued physical line would
      not be captured — a real future collision could slip past the guard
      silently, the exact non-vacuity failure mode Standing Order #5
      requires closed. The described mutation test only proves the guard
      catches a single-line double-quoted collision, narrower than what
      FR-015/NFR-003 ask the guard to guarantee.
    remediation: >-
      In plan.md §A, commit to one concrete extraction method: parse the
      already-loaded YAML jobs: mapping and iterate each job's steps[].run
      string (structured traversal, like _spec_kitty_run_performance_leaks's
      job/env traversal but applied to run:), matching both single- and
      double-quoted --suite-key values applied to the FULL run: string (not
      line-by-line, so a continued line cannot hide an occurrence). Correct
      the citation to name the real per-line-scan precedent. Add a mutation
      test variant colliding two suite-keys with different quote styles.

  - id: PLAN-VERIFY-002
    lens: "Gates — §E gate-set verification against live workflow files"
    severity: 2
    title: "plan.md's packs.yml claim ('should NOT fire') describes the wrong mechanism — the workflow always triggers; only its lane jobs skip"
    evidence:
      - artifact: "plan.md §E 'NOT ENFORCED' list: 'Doctrine packs gate (`packs.yml`, path-filtered) — should NOT fire; this mission touches no `packs/` sources'"
      - code: ".github/workflows/packs.yml:12-19 (deliberately no top-level on.*.paths, #3008)"
      - code: ".github/workflows/packs.yml:39-44 (top-level on: has pull_request/push/workflow_dispatch with no paths: filter)"
      - code: ".github/workflows/packs.yml:245-258 (packs-gate terminal job: if: always() && !cancelled(), always runs)"
    claim: >-
      packs.yml deliberately carries no top-level path filter (its own
      header comment names this as intentional Gate-0 avoidance, #3008) —
      the workflow, including its terminal packs-gate aggregator, fires on
      every PR unconditionally; what does NOT run for a non-packs/-touching
      diff is the per-lane verification work inside it. Plan.md's phrasing
      describes the opposite mechanism. The net practical conclusion (no
      packs-specific verification blocks this mission) is still correct,
      but the cited mechanism is factually backwards.
    remediation: >-
      In plan.md §E, change the packs.yml line to state that packs.yml
      triggers on every PR (deliberately no top-level path filter, #3008)
      but its changes job's filter does not match .github/workflows/** or
      tests/architectural/**, so every built-in/internal lane job reports
      if: false (skipped) and the terminal packs-gate resolves green with no
      packs-specific work performed for this mission's diff.
