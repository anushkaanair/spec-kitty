schema: review-findings/v1
complete: true
phase: plan
lens_group: arch
mission: ci-nightly-interpreter-matrix-45min-timeout-01M3G17F
findings:
  - id: PLAN-ARCH-001
    lens: FR-017/SC-010 reuse-vs-rejection decision soundness
    severity: 4
    title: >-
      "Parseability confirmed" is factually false: _gate_coverage.py's
      parse_workflow already fails to parse the CURRENT interpreter-matrix
      job into any Gate, and will fail identically for every proposed shard
      job, breaking gates_for_target's FR-016 detection as designed.
    evidence:
      - artifact: "plan.md §A 'Reuse-vs-rejection decision' point 6 ('Parseability confirmed'), and §A 'Per-shard job shape' code block"
      - code: ".github/workflows/ci-nightly.yml:416 (current interpreter-matrix pytest step: `uv run --frozen --python \"${{ matrix.python-version }}\" --all-extras pytest -m \"fast or unit\" ...`)"
      - code: "tests/architectural/_gate_coverage.py:230-268 (_FLAG_TOKENS / _PREFIX_RE), :354-376 (strip_to_command), :398-414 (parse_pytest_invocation), :814-848 (parse_workflow)"
    claim: >-
      Plan.md §A states: "each new shard's pytest invocation in ci-nightly.yml
      will keep the exact same shape the current single job already uses ...
      a shape _gate_coverage.py's parse_workflow already recognizes today (it
      already parses the current single interpreter-matrix job into one
      Gate)." This claim is empirically false. Running
      `tests.architectural._gate_coverage.parse_workflow(Path(".github/workflows/ci-nightly.yml"))`
      in this checkout returns exactly 5 gates — for jobs performance, e2e,
      stress, full-module-matrix, and integration-next — with NO gate for job
      "interpreter-matrix" at all. Root cause, isolated and reproduced
      directly against `_gate_coverage.strip_to_command`/`_PREFIX_RE`: the
      `_FLAG_TOKENS` regex `(?:\s+--\S+(?:\s+'[^']*'|\s+"[^"]*"|\s+(?!pytest\b)\S+)?)*`
      greedily treats the bare `--frozen` flag's optional "value" alternative
      as matching the NEXT flag's name token (`--python`, itself), leaving
      that second flag's actual quoted value (`"3.13"`) unconsumed;
      `strip_to_command`'s loop then sees `s = '"3.13" --all-extras pytest ...'`,
      which matches neither `_PYTEST_HEAD_RE`, `_PREFIX_RE`, nor
      `_PATH_PYTEST_RE`, so the loop breaks before reaching the `pytest` token
      and `parse_pytest_invocation` returns `None` — silently, with no
      exception. This reproduces identically for a manually-substituted,
      fully-resolved line (`uv run --frozen --python "3.13" --all-extras
      pytest -m "fast or unit" ...`), so it is not an artifact of the
      unrelated `_matrix_includes`-only-handles-`matrix.include` gap (which
      independently ALSO causes `${{ matrix.python-version }}` to substitute
      to an empty string for this non-`include` matrix shape — a second,
      separate defect in the same parse path, not raised by plan.md at all).
      The five OTHER ci-nightly.yml jobs that DO parse successfully all use
      the simpler `uv run --frozen pytest ...` shape (a single bare flag
      immediately before `pytest`) — confirmed at lines 129, 231, 326, 597 —
      never the two-flag `--frozen --python "<value>" --all-extras` shape
      unique to line 416. Plan.md's proposed per-shard job template in the
      same section reproduces this exact broken prefix verbatim
      (`uv run --frozen --python "3.13" --all-extras pytest -m "fast or unit"
      <shard's paths/--ignore> ...`), so every new shard job will ALSO fail
      to parse into a Gate. This directly breaks the plan's own reuse
      mechanism in §A point 2: "calling gates_for_target for each one gives
      FR-016's 'job renamed/deleted' detection for free (the exact
      RuntimeError this function already raises)" — `gates_for_target`
      filters the REAL gates returned by `parse_workflow`/`load_gates()` by
      `(workflow, job)`; since no gate will ever exist for any
      `interpreter-matrix-shard-<N>` job (regardless of whether that job is
      correctly present and correctly configured in `ci-nightly.yml`),
      `gates_for_target` will unconditionally raise "resolved to 0 gates" for
      every shard, always — not only when a shard is actually renamed or
      dropped. FR-016's "deleted-shard detection" and FR-004's
      roster-vs-live-selector comparison (§A point 5, which also depends on
      reading the shard's real parsed selector) as designed cannot
      distinguish a healthy shard from a dropped one: both produce the
      identical RuntimeError. The mechanism is not merely "unconsumed today"
      (which plan.md correctly establishes for the pre-existing
      BASELINE_TARGETS layer) — for THIS mission's proposed per-shard usage,
      it is non-functional by construction, and the new architectural test
      module (IC-02) would be permanently red for a reason unrelated to
      coverage or roster correctness, defeating Standing Order #5's
      non-vacuity requirement in the opposite direction (an always-failing
      check is not a working gate either).
    remediation: >-
      Before committing to this reuse decision, the plan (or the
      implement-phase author, before authoring test_interpreter_shard_coverage.py)
      must actually run `_gate_coverage.parse_workflow` /
      `_gate_coverage.gates_for_target` against a draft copy of the proposed
      shard job YAML (not just eyeball the shape) and confirm a non-empty
      Gate list results. Two independent fixes close the gap: (1) fix
      `_gate_coverage.py`'s `_FLAG_TOKENS` regex so a bare `--flag` immediately
      followed by another `--flag "<value>"` does not consume the second
      flag's name as the first flag's value (e.g. require the value
      alternative to not itself start with `--`, or require the flag-with-value
      form to be tried greedily before the bare-flag form) — this also fixes
      the pre-existing, currently-silent gap for the CURRENT interpreter-matrix
      job, which is un-covered by the orphan/duplicate model today regardless
      of this mission; or (2) change the per-shard `run:` step's `uv run`
      invocation to a shape that already parses correctly today (e.g. drop
      the explicit `--python "<value>"` flag from the `uv run` line — Python
      selection is already pinned via `actions/setup-python` +
      `UV_PROJECT_ENVIRONMENT` earlier in the same job — leaving
      `uv run --frozen --all-extras pytest ...`, structurally identical to
      the already-parsing performance/e2e/stress/integration-next jobs).
      Whichever fix is chosen, add a regression test to
      `tests/architectural/_gate_coverage.py`'s own test suite pinning that
      `uv run --frozen --python "X" --all-extras pytest ...` parses into a
      Gate, and re-verify empirically (not by inspection) that
      `gates_for_target` returns a real match for each shard's job key before
      relying on it for FR-016.
  - id: PLAN-ARCH-002
    lens: FR-017/SC-010 reuse-vs-rejection decision soundness
    severity: 2
    title: >-
      Plan.md misattributes a quoted docstring sentence to the wrong
      function when justifying the reuse of collect_real_union_for_target.
    evidence:
      - artifact: "plan.md §A 'Reuse-vs-rejection decision' bullet on collect_real_union_for_target"
      - code: "tests/architectural/_gate_coverage.py:2605-2616 (BaselineTarget docstring, contains the quoted sentence) vs :2677-2694 (collect_real_union_for_target's actual docstring, does not contain it)"
    claim: >-
      Plan.md writes: "`collect_real_union_for_target(target, gates,
      repo_root)` (line ~2677) — unions `collect_job_nodeids` over every gate
      `gates_for_target` returns for ONE `(workflow, job)` pair, explicitly
      designed so multiple MATRIX LEGS of the SAME job key are unioned
      transparently (its own docstring: 'a shard split alone (same total
      coverage, more legs) cannot false-red')." The quoted sentence is real
      and verified verbatim in the source, but it appears in
      `BaselineTarget`'s class docstring (line ~2614), not in
      `collect_real_union_for_target`'s own docstring (lines 2682-2694, which
      instead discusses the baseline/current-side symmetry via
      `freeze_baselines`). This does not change the underlying technical
      conclusion (the union-over-matching-legs behavior is real and correctly
      described), but a reader who checks "collect_real_union_for_target's
      own docstring" for that sentence, as instructed, will not find it there
      — a citation-accuracy gap in a section whose entire premise is
      first-hand-verified-against-source claims.
    remediation: >-
      Correct the attribution to name `BaselineTarget`'s class docstring (or
      simply drop "its own docstring" and cite it as "the module's own
      comment, on BaselineTarget") so the citation resolves to the actual
      source location on inspection.
