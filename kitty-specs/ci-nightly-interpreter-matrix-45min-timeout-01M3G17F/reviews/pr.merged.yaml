  - code: '.github/workflows/ci-nightly.yml:967 (`needs: [performance, e2e, stress, interpreter-matrix-shard-1,
      interpreter-matrix-shard-2, interpreter-matrix-shard-3, interpreter-matrix-shard-4, interpreter-matrix-shard-5,
      interpreter-matrix-shard-6, integration-next, full-module-matrix]` — all 6 shard keys hand-typed,
