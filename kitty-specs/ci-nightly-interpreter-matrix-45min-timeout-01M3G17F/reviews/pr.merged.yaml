    <= set(needs)`, failing loudly and naming the missing shard(s). Pair it with a mutation test (a scratch
    `needs:` list with one shard key removed) proving the assertion can fail, mirroring test_guard_fails_when_a_shard_is_dropped_from_the_job_list''s
    existing non-vacuity pattern.

    '
