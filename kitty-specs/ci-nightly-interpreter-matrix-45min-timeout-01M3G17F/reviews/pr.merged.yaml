  - code: 'tests/architectural/test_performance_marker_guard.py (grep for "nightly-summary"/"needs" across
      this file and test_interpreter_shard_coverage.py returns no hits — no test in either new/updated
      module checks nightly-summary''s needs: against INTERPRETER_SHARD_JOB_KEYS)'
  claim: 'Same class of hazard as PR-BOUNDARY-001, on a different surface: the shard identity list is
    hand-restated a THIRD time (roster -> per-shard `run:` paths -> nightly-summary''s `needs:`/echo block),
    and this third copy has zero automated coverage. FR-006 explicitly names this exact hazard ("a stale
