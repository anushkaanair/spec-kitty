    evidence:
      - artifact: "T002 Notes (~line 268): 'checkpoint 0 of 3' groups T009+T010 as one item."
      - artifact: "T007 Purpose/Notes (~lines 496-524): self-labels 'checkpoint 1 of 3' and 'one of two mandatory checkpoints', explicitly excluding T009."
      - artifact: "T009 step 4 (~line 586): self-labels 'checkpoint 2 of 3'."
      - artifact: "T010 step 3 (~line 608): self-labels 'checkpoint 3 of 3'."
    claim: >
      Four subtask sections disagree on how many parseability checkpoints
      exist and how they are numbered — an implementer could plausibly
      miscount which checkpoints are required.
    remediation: >
