  - id: TASKS-VERIFY-001
    lens: "absolute-path leak hygiene (independent git-history verification)"
    severity: 4
    title: >-
      The mission's own tasks-phase git history still contains a leaked
      absolute local path right now; tasks.md/WP01 wording asserts it "was
      fixed" when only the file CONTENT was redacted, not the history
    evidence:
      - code: "git log -p main..HEAD | grep -cE '/home/|/tmp/' -> 10, confirmed independently by both this lens and the refuter."
      - code: "git show afcf3bcd6 introduces the leak; git show 13dc5d966 redacts file content via an additive commit, not a rewrite — afcf3bcd6's own diff permanently retains the raw path."
      - code: "Current working tree is genuinely clean (verified); git ls-remote --heads origin confirms the branch has not yet been pushed — remediation window still open."
    claim: >
      A present-tense, already-committed public-repo path leak exists in this
      mission's own git history right now, not merely a future risk.
    remediation: >
      Requires operator-authorized history rewrite before this branch is ever
      pushed — this session (and any fix-round session) is explicitly
      forbidden from rebase/amend/reset and cannot self-remediate the history.
      The fixer corrects the misleading "was fixed" wording and adds a
      prominent, explicit KNOWN ISSUE callout naming the exact commits and the
      required operator action.
    verdict: confirmed

  - id: TASKS-VERIFY-002
    lens: "absolute-path leak hygiene (forward-looking gate robustness)"
    severity: 4
    title: >-
      T008's binding pre-push leak check will trip non-zero on its very
      first run for a reason the WP text has no instruction for, risking a
      stuck implementer or an improvised forbidden git operation
    evidence:
      - artifact: "WP01 T008/T011/T013: 'find and fix the leaking content... proceed once count is 0' presumes every nonzero reading is fresh/fixable."
      - code: "Count is already 10 before WP01 starts, for a reason no content edit can fix (the leak lives in a prior commit's diff, not current content)."
    claim: >
      As written, an implementer either loops forever, silently stalls, or
      self-authorizes a forbidden rebase to force the count to zero.
    remediation: >
      Add an explicit escalation-fallback clause to T008/T011/T013: if nonzero
      and not caused by the implementer's own uncommitted/new change, trace to
      the specific already-committed commit and STOP + escalate to the
      operator; never attempt rebase/amend/reset.
    verdict: confirmed
