  - id: TASKS-DECOMP-001
    lens: "Bounded-diff / one-PR-reviewable-in-one-sitting"
    severity: 4
    title: "WP01's owned_files grants a directory-wide scripts/ci/*.py glob that contradicts the mission's own 'no code change to nightly_escalation.py' claim and the 'bounded diff' claim"
    evidence:
      - code: "kitty-specs/ci-nightly-interpreter-matrix-45min-timeout-01M3G17F/tasks/WP01-interpreter-matrix-shard-split.md:52-57 (owned_files includes scripts/ci/*.py)"
      - artifact: "tasks.md §'WP granularity', lines 58-60: bounded-diff claim enumerates exactly 4 files, none under scripts/ci/."
      - artifact: "plan.md:32 and spec.md:410 — scripts/ci/nightly_escalation.py is explicitly unmodified/no-code-change for this mission."
      - code: "No T00X subtask names any scripts/ci/ file in its 'Files:' line; every other WP file in kitty-specs/ names one specific script file, never a directory glob (confirmed by refuter, e.g. ci-coverage-honesty-01M3CZVN/WP03 owns nightly_escalation.py by exact name)."
    claim: >
      WP01's owned_files grants ownership of every file under scripts/ci/ via
      a directory-wide glob, unused by any subtask and inconsistent with the
      mission's own "no code change" statements — risking spurious ownership
      collisions against concurrent missions.
    remediation: >
      Remove `scripts/ci/*.py` from WP01's `owned_files` entirely.
    verdict: confirmed

  - id: TASKS-DECOMP-002
