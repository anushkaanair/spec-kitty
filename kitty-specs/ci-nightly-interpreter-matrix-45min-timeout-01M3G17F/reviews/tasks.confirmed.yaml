  - id: TASKS-SEQ-004
    lens: "mission-derived — dispatch-run mapping fidelity"
    severity: 3
    title: "The binding pre-push leak check (T008/T011/T013) is diff-history-based and is already non-zero for reasons unrelated to any live leak"
    evidence:
      - artifact: "WP01 T008/T011/T013 step 1: binding check text using `git log -p main..HEAD | grep -cE '/home/|/tmp/'`."
      - code: "Re-run: count is 10, not 0, before WP01's own first commit — confirmed independently by both this lens and the refuter."
    claim: >
      `git log -p` re-shows already-fixed history forever, so this mission's
      own leak-then-redact commit pair (afcf3bcd6/13dc5d966) permanently
      trips the check even though current tree content is clean.
    remediation: >
      Proposed: switch the check to a diff-scoped scan immune to already-fixed
      history. NOTE FOR THE FIXER: this proposed remediation directly conflicts
      with the mission brief's explicit, orchestrator-mandated binding-check
      text (`git log -p main..HEAD | grep -cE ...`) — see the Fix Round
      instructions for how this tension is resolved (a "known baseline +
      operator escalation" callout is added instead of changing the check's
      command).
    verdict: confirmed

