  - id: PR-FRESH-001
    status: unresolved
    remaining_severity: 3
    reason: >
      Empirically drove the production `_shard_workflow_divergences` at aad3e78f8 via a
      scratch-copied `Gate` list (never touching the tracked workflow): harmless reformats
      ("unit or fast", "fast  or  unit", "(fast or unit)") now correctly report no
      divergence, and the shipped positive controls (drop "unit" -> flagged; add
      "and not slow" -> flagged) both pass under `pytest tests/architectural/test_interpreter_shard_coverage.py -q`
      (15 passed). But changing "fast or unit" to "fast and unit" for the same shard --
      a real, materially different selection (intersection vs. union of the two marker
      sets) explicitly named in the verification brief -- produced `flagged_as_divergence=False`,
      because `positive_marker_tokens`-based comparison only tracks WHICH marker names are
      referenced and their NOT-sign, never the AND/OR combinator between them, so "fast or
      unit" and "fast and unit" collapse to the identical (positive={fast,unit}, negative={})
      signature; independently confirmed the same script's precedence check (comparing
      `_pytest.mark.expression.Expression.evaluate` against Python's own not/and/or
      precedence across all 8 boolean assignments for 7 expressions, including "fast or
      unit and not slow") that the negative-token "not (...)" trick itself is sound and not
      mangled -- the residual gap is purely the missing combinator axis, not the sign walk.
      No other test in the suite (`test_shard_union_equals_full_selection_with_zero_gap_and_zero_overlap`
      builds its shard gates from the roster's own constant marker, never the committed
      workflow) would catch this either, so an `or`->`and` edit to the committed workflow
      would silently pass CI.

